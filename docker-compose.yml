services:
  postgres:
    image: docker.io/library/postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: noname
      POSTGRES_PASSWORD: noname_dev
      POSTGRES_DB: app
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-dbs.sh:/docker-entrypoint-initdb.d/init-dbs.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U noname -d app"]
      interval: 5s
      timeout: 3s
      retries: 10

  dragonfly:
    image: docker.dragonflydb.io/dragonflydb/dragonfly:latest
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -h localhost ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  clickhouse:
    image: docker.io/clickhouse/clickhouse-server:latest
    ports:
      - "8123:8123"
      - "9001:9000"
    environment:
      CLICKHOUSE_DB: app
      CLICKHOUSE_USER: noname
      CLICKHOUSE_PASSWORD: noname_dev
    volumes:
      - clickhouse_data:/var/lib/clickhouse
    healthcheck:
      test: ["CMD-SHELL", "clickhouse-client --query 'SELECT 1'"]
      interval: 5s
      timeout: 3s
      retries: 10

  logto-init:
    image: ghcr.io/logto-io/logto:latest
    environment:
      DB_URL: postgres://noname:noname_dev@postgres:5432/logto
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        cd /etc/logto
        npx logto db seed --swe
        npx logto db alt deploy next

  logto:
    image: ghcr.io/logto-io/logto:latest
    ports:
      - "3001:3001"
      - "3002:3002"
    environment:
      DB_URL: postgres://noname:noname_dev@postgres:5432/logto
      ENDPOINT: http://localhost:3001
      ADMIN_ENDPOINT: http://localhost:3002
    depends_on:
      postgres:
        condition: service_healthy
      logto-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:3001 || exit 0"]
      interval: 10s
      timeout: 5s
      retries: 20

  s3:
    image: ghcr.io/clockwisesoftware/s3rver:latest
    ports:
      - "9000:9000"
    environment:
      BUCKETS: noname-assets
      HOST: "0.0.0.0"
      PORT: "9000"
      VHOST_BUCKETS: "0"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:9000 || exit 0"]
      interval: 5s
      timeout: 3s
      retries: 10

  s3-init:
    image: docker.io/amazon/aws-cli:latest
    environment:
      AWS_ACCESS_KEY_ID: S3RVER
      AWS_SECRET_ACCESS_KEY: S3RVER
      AWS_DEFAULT_REGION: us-east-1
    depends_on:
      s3:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        if aws --endpoint-url http://s3:9000 s3 ls s3://noname-assets 2>/dev/null; then
          echo "Bucket already exists"
        else
          aws --endpoint-url http://s3:9000 s3 mb s3://noname-assets
        fi

  jaeger:
    image: docker.io/jaegertracing/all-in-one:latest
    ports:
      - "16686:16686"
      - "4318:4318"
    environment:
      - COLLECTOR_OTLP_ENABLED=true

volumes:
  postgres_data:
  clickhouse_data: