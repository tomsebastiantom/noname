# Local S3-compatible emulator for asset storage dev.
#
# This stands in for Cloudflare R2 (R2 is S3-compatible, so the API's
# R2 asset adapter works against either with zero code change — only env differs).
# s3rver is the zero-config option: no credentials, no console.
#
#   docker compose up -d
#
# Then point the server at it via packages/server/.env (see .env.example):
#   R2_ENDPOINT=http://localhost:9000
#   R2_BUCKET=noname-assets
#   R2_ACCESS_KEY_ID=dummy
#   R2_SECRET_ACCESS_KEY=dummy
#
# For PRODUCTION, swap these for Cloudflare R2 values:
#   R2_ENDPOINT=https://<account-id>.r2.cloudflarestorage.com
#   R2_REGION=auto
# and real R2 API tokens.

services:
  s3:
    image: s3rver/s3rver
    command: s3rver -address :9000 --no-sign-request
    ports:
      - "9000:9000"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:9000 || exit 0"]
      interval: 5s
      timeout: 3s
      retries: 10

  s3-init:
    image: amazon/aws-cli
    depends_on:
      s3:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    # s3rver ignores auth in --no-sign-request mode; create the bucket idempotently.
    command: "aws --endpoint-url http://s3:9000 --no-sign-request s3 mb s3://noname-assets || true"
    restart: "no"
