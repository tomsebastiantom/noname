services:
  postgres:
    image: docker.io/library/postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: noname
      POSTGRES_PASSWORD: noname_dev
      POSTGRES_DB: app
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/compose/init-dbs.sh:/docker-entrypoint-initdb.d/init-dbs.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U noname -d app"]
      interval: 5s
      timeout: 3s
      retries: 10

  dragonfly:
    image: docker.dragonflydb.io/dragonflydb/dragonfly:latest
    ports:
      - "6379:6379"
    # Podman/local dev: 1 thread for low RAM. BullMQ needs emulated cluster + hashtag locks.
    command:
      - "--proactor_threads=1"
      - "--cluster_mode=emulated"
      - "--lock_on_hashtags"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -h localhost ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  clickhouse:
    image: docker.io/clickhouse/clickhouse-server:latest
    ports:
      - "8123:8123"
      - "9001:9000"
    environment:
      CLICKHOUSE_DB: app
      CLICKHOUSE_USER: noname
      CLICKHOUSE_PASSWORD: noname_dev
    volumes:
      - clickhouse_data:/var/lib/clickhouse
    healthcheck:
      test: ["CMD-SHELL", "clickhouse-client --query 'SELECT 1'"]
      interval: 5s
      timeout: 3s
      retries: 10

  postgres-init-dbs:
    image: docker.io/library/postgres:16-alpine
    environment:
      PGHOST: postgres
      PGUSER: noname
      PGPASSWORD: noname_dev
      PGDATABASE: app
    volumes:
      - ./scripts/compose/ensure-extra-dbs.sh:/ensure-extra-dbs.sh:ro
    entrypoint: ["/bin/sh", "/ensure-extra-dbs.sh"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  keto-migrate:
    image: oryd/keto:v25.4.0
    environment:
      DSN: postgres://noname:noname_dev@postgres:5432/keto?sslmode=disable
    volumes:
      - ./config/keto:/etc/keto:ro
    command: migrate up -y -c /etc/keto/keto.yml
    depends_on:
      postgres-init-dbs:
        condition: service_completed_successfully
    restart: on-failure

  keto:
    image: oryd/keto:v25.4.0
    ports:
      - "4466:4466"
      - "4467:4467"
      - "4468:4468"
    environment:
      DSN: postgres://noname:noname_dev@postgres:5432/keto?sslmode=disable
    volumes:
      - ./config/keto:/etc/keto:ro
    command: serve -c /etc/keto/keto.yml
    depends_on:
      keto-migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:4466/health/ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 15

  zitadel:
    image: ghcr.io/zitadel/zitadel:latest
    ports:
      - "8080:8080"
    environment:
      ZITADEL_DATABASE_POSTGRES_HOST: postgres
      ZITADEL_DATABASE_POSTGRES_PORT: 5432
      ZITADEL_DATABASE_POSTGRES_DATABASE: zitadel
      ZITADEL_DATABASE_POSTGRES_USER_USERNAME: noname
      ZITADEL_DATABASE_POSTGRES_USER_PASSWORD: noname_dev
      ZITADEL_DATABASE_POSTGRES_USER_SSL_MODE: disable
      ZITADEL_DATABASE_POSTGRES_ADMIN_USERNAME: noname
      ZITADEL_DATABASE_POSTGRES_ADMIN_PASSWORD: noname_dev
      ZITADEL_DATABASE_POSTGRES_ADMIN_SSL_MODE: disable
      ZITADEL_EXTERNALSECURE: "false"
      ZITADEL_EXTERNALPORT: "8080"
      ZITADEL_EXTERNALDOMAIN: localhost
      ZITADEL_TLS_ENABLED: "false"
      ZITADEL_FIRSTINSTANCE_ORG_HUMAN_USERNAME: admin
      ZITADEL_FIRSTINSTANCE_ORG_HUMAN_PASSWORD: NonameAdmin1!
      ZITADEL_FIRSTINSTANCE_ORG_HUMAN_PASSWORDCHANGEREQUIRED: "false"
      ZITADEL_FIRSTINSTANCE_ORG_MACHINE_MACHINE_USERNAME: noname-backend
      ZITADEL_FIRSTINSTANCE_ORG_MACHINE_MACHINE_NAME: noname-backend
      ZITADEL_FIRSTINSTANCE_ORG_MACHINE_MACHINEKEY_TYPE: "1"
      ZITADEL_FIRSTINSTANCE_MACHINEKEYPATH: /output/noname-backend-sa.json
    command:
      - start-from-init
      - --masterkey
      - xV9kL2mN4pQ7rS1tU8wY3aB6cD0eF5hJ
      - --tlsMode
      - disabled
    volumes:
      - zitadel_keys:/output
    depends_on:
      postgres-init-dbs:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8080/ui/console || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30

  s3:
    image: ghcr.io/clockwisesoftware/s3rver:latest
    ports:
      - "9000:9000"
    environment:
      BUCKETS: noname-assets
      HOST: "0.0.0.0"
      PORT: "9000"
      VHOST_BUCKETS: "0"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:9000 || exit 0"]
      interval: 5s
      timeout: 3s
      retries: 10

  s3-init:
    image: docker.io/amazon/aws-cli:latest
    environment:
      AWS_ACCESS_KEY_ID: S3RVER
      AWS_SECRET_ACCESS_KEY: S3RVER
      AWS_DEFAULT_REGION: us-east-1
    depends_on:
      s3:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        if aws --endpoint-url http://s3:9000 s3 ls s3://noname-assets 2>/dev/null; then
          echo "Bucket already exists"
        else
          aws --endpoint-url http://s3:9000 s3 mb s3://noname-assets
        fi

  jaeger:
    image: docker.io/jaegertracing/all-in-one:latest
    ports:
      - "16686:16686"
      - "4318:4318"
    environment:
      - COLLECTOR_OTLP_ENABLED=true

  # HashiCorp Vault — dev server (same adapter path as prod; see docs/2026-08-04/VAULT-CLIENT-SECRETS.md)
  vault:
    image: hashicorp/vault:1.17
    ports:
      - "8200:8200"
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: dev-root-token
      VAULT_DEV_LISTEN_ADDRESS: 0.0.0.0:8200
    cap_add:
      - IPC_LOCK
    command: server -dev
    healthcheck:
      test: ["CMD-SHELL", "vault status -address=http://127.0.0.1:8200 || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres_data:
  clickhouse_data:
  zitadel_keys: