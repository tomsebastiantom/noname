version: v25.4.0

log:
  level: info

# DSN overridden by DSN env in docker-compose / K8s
dsn: postgres://noname:noname_dev@postgres:5432/keto?sslmode=disable

namespaces:
  location: file:///etc/keto/namespaces.ts

serve:
  read:
    host: 0.0.0.0
    port: 4466
  write:
    host: 0.0.0.0
    port: 4467
  metrics:
    host: 0.0.0.0
    port: 4468
