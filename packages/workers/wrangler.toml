name = "noname-edge"
main = "src/index.ts"
compatibility_date = "2025-01-01"
compatibility_flags = ["nodejs_compat"]

# Pin dev port so rspack proxy and docs stay in sync. If bind fails, kill stale workerd on 8787.
[dev]
port = 8787

[vars]
API_ORIGIN = "http://localhost:3000"
ZITADEL_ISSUER = "http://localhost:8080"
# ZITADEL_CLIENT_ID / ZITADEL_PROJECT_ID — updated by pnpm init:zitadel
ZITADEL_CLIENT_ID = "387316757292908554"
ZITADEL_PROJECT_ID = "387316756252721162"

[[kv_namespaces]]
binding = "KV"
id = "noname-edge-kv"

[[r2_buckets]]
binding = "R2"
bucket_name = "noname-assets"

[env.production]
API_ORIGIN = "https://api.noname.dev"
ZITADEL_ISSUER = "https://auth.noname.dev"

[[env.production.kv_namespaces]]
binding = "KV"
id = "noname-edge-kv-prod"

[[env.production.r2_buckets]]
binding = "R2"
bucket_name = "noname-assets-prod"
