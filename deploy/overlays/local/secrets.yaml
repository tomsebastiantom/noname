# Local dev credentials — the ONLY place these values exist.
#
# Before this file, `noname_dev` and friends were inline in `deploy/base/*`, which meant the local development
# password was one `kubectl apply` away from another environment. `base/` now references these keys by name
# (`valueFrom.secretKeyRef`), so the shape is environment-neutral and the values are not.
#
# These are DEV VALUES and are intentionally readable in git: they only work against a throwaway local cluster.
# A staging or production overlay must NOT copy this file — it should reference an external secret manager
# (see docs/2026-10-31/ENVIRONMENTS-AND-PROMOTION.md §6, gap 3).
apiVersion: v1
kind: Secret
metadata:
  name: noname-infra-secrets
  namespace: noname
  labels:
    app.kubernetes.io/part-of: noname
    noname.io/purpose: local-dev-credentials
type: Opaque
stringData:
  # postgres — the init ConfigMap creates the extra databases, this is the role password
  POSTGRES_PASSWORD: noname_dev

  # clickhouse
  CLICKHOUSE_PASSWORD: noname_dev

  # vault — dev server root token (dev mode: unsealed, in-memory, no real security)
  VAULT_ROOT_TOKEN: dev-root-token

  # nango
  NANGO_DB_PASSWORD: noname_dev
  NANGO_SECRET_KEY: 256716d6-6cb0-4c99-91ab-cf44fb9034fb
  NANGO_ENCRYPTION_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=

  # zitadel — the masterkey MUST stay constant for the life of an instance, or existing data cannot be
  # decrypted. Changing it is equivalent to losing the identity database.
  ZITADEL_MASTERKEY: xV9kL2mN4pQ7rS1tU8wY3aB6cD0eF5hJ
  ZITADEL_ADMIN_PASSWORD: NonameAdmin1!

  # s3rver (the S3 emulator) accepts any credentials; these are shape-compatible with the real API
  S3_ACCESS_KEY: S3RVER
  S3_SECRET_KEY: S3RVER

  # keto — its config is a ConfigMap, which cannot hold a credential, so the DSN lives here
  KETO_DSN: postgres://noname:noname_dev@postgres:5432/keto?sslmode=disable

  # nango stores this as a full URL rather than assembling it from parts
  RECORDS_DATABASE_URL: postgresql://noname:noname_dev@postgres:5432/nango
