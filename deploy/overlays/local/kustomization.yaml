# Local overlay — the cluster's job here is infra + the browser fleet.
#
# Services (api, worker) and the client are NOT how this developer works locally: they run from the host with
# `pnpm dev` / rspack, against this cluster's infra. They are applied here anyway because the parity check
# ("do the manifests still work?") needs them, and because staging uses the same base plus its own overlay.
# See docs/2026-10-31/ENVIRONMENTS-AND-PROMOTION.md §1.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: noname

resources:
  - ../../base
  # Dev credentials. `base/` references these keys by name; the values only exist here. A staging or production
  # overlay must not copy this file — it references an external secret manager instead.
  - secrets.yaml
  # Browser-facing HTTP services on Traefik (host ports 80/443) instead of one port-forward each.
  - ingress.yaml

patches:
  # ── storage class ────────────────────────────────────────────────────────────────────────────────
  # base/ deliberately omits storageClassName (a provisioner is an environment concern), but a *bound* PVC
  # cannot have the field removed - "spec is immutable after creation". So the overlay sets it explicitly
  # instead of inheriting the cluster default. Staging/prod do the same with their own class.
  - target: { kind: PersistentVolumeClaim }
    patch: |-
      - op: add
        path: /spec/storageClassName
        value: local-path

  # ── NodePort exposure: host → cluster infra ─────────────────────────────────────────────────────
  # api/worker run on the host (`pnpm dev`) against infra in the cluster. Without this, reaching the services
  # needs nine `kubectl port-forward` processes that die with their terminal. Fixed ports so `.env` never has to
  # guess; `node scripts/k8s.mjs nodeports` prints the map and rewrites the addresses.
  #
  # Local only, never base/: a NodePort binds a port on every node, which is wrong for staging and production
  # (it bypasses Ingress, TLS and NetworkPolicy). base/ stays ClusterIP.
  #
  # ZITADEL is deliberately NOT exposed. `ZITADEL_ISSUER` is http://localhost:8080 and that name is baked into
  # every issued token; pods reach it through the `localhost-proxy` sidecar. A NodePort would mean re-issuing
  # identity against a different issuer, invalidating every token. Keep one port-forward for 8080.
  - target: { kind: Service, name: postgres }
    patch: |-
      - { op: add, path: /spec/type, value: NodePort }
      - { op: add, path: /spec/ports/0/nodePort, value: 30432 }
  - target: { kind: Service, name: dragonfly }
    patch: |-
      - { op: add, path: /spec/type, value: NodePort }
      - { op: add, path: /spec/ports/0/nodePort, value: 30379 }
  - target: { kind: Service, name: clickhouse }
    patch: |-
      - { op: add, path: /spec/type, value: NodePort }
      - { op: add, path: /spec/ports/0/nodePort, value: 30123 }
      - { op: add, path: /spec/ports/1/nodePort, value: 30901 }
  - target: { kind: Service, name: s3 }
    patch: |-
      - { op: add, path: /spec/type, value: NodePort }
      - { op: add, path: /spec/ports/0/nodePort, value: 30900 }
  - target: { kind: Service, name: vault }
    patch: |-
      - { op: add, path: /spec/type, value: NodePort }
      - { op: add, path: /spec/ports/0/nodePort, value: 30200 }
  - target: { kind: Service, name: keto }
    patch: |-
      - { op: add, path: /spec/type, value: NodePort }
      - { op: add, path: /spec/ports/0/nodePort, value: 30466 }
      - { op: add, path: /spec/ports/1/nodePort, value: 30467 }
  - target: { kind: Service, name: nango }
    patch: |-
      - { op: add, path: /spec/type, value: NodePort }
      - { op: add, path: /spec/ports/0/nodePort, value: 30003 }
      - { op: add, path: /spec/ports/1/nodePort, value: 30009 }
  - target: { kind: Service, name: jaeger }
    patch: |-
      - { op: add, path: /spec/type, value: NodePort }
      - { op: add, path: /spec/ports/0/nodePort, value: 30686 }
      - { op: add, path: /spec/ports/1/nodePort, value: 30431 }
