# Seed Job — fills a freshly bootstrapped cluster with demo data.
#
# Runs the same image as the API and drives the **HTTP API** (`API_BASE`), which is how the seeder has
# always worked: it is a client, not a database script. That is also why it must run *after* the API is
# Ready and *after* identity exists — every call is authenticated.
#
# Not applied by `k8s-up.ps1`: seeding is a deliberate act (it writes demo content and rebinding
# evidence). Apply it explicitly after `scripts/k8s-identity.ps1`:
#   kubectl -n noname delete job seed --ignore-not-found
#   kubectl apply -f deploy/jobs/seed.yaml
apiVersion: batch/v1
kind: Job
metadata:
  name: seed
  namespace: noname
spec:
  backoffLimit: 1
  # Keep the finished Job around long enough to read its logs, then delete it.
  ttlSecondsAfterFinished: 3600
  template:
    spec:
      restartPolicy: Never
      enableServiceLinks: false
      containers:
        - name: seed
          image: localhost/noname-api:dev
          imagePullPolicy: IfNotPresent
          # Run from the package directory, like the API does. Running from /app resolved the entrypoint
          # but not its dependencies (observed: ERR_MODULE_NOT_FOUND for zod), because pnpm's isolated
          # layout keeps a package's deps under that package's own node_modules.
          command: ["/app/node_modules/.bin/tsx", "src/cli.ts", "full"]
          workingDir: /app/packages/seeding
          envFrom:
            - secretRef: { name: noname-env }
          env:
            # The seeder talks to the API through the Service, not localhost.
            - { name: API_BASE, value: "http://api:3000" }
            - { name: NODE_ENV, value: development }
          resources:
            requests: { cpu: 200m, memory: 512Mi }
            limits: { memory: 1Gi }
      # The seeder logs in through ZITADEL, and `ZITADEL_ISSUER` is `http://localhost:8080` (tokens are
      # issued for that name; the browser reaches it through a port-forward). Inside a pod `localhost` is
      # the pod itself, so a loopback proxy is needed - see the comment block in deploy/app/api.yaml.
      #
      # It is an *initContainer with restartPolicy: Always*, i.e. a **native sidecar** (GA in k8s 1.29;
      # this cluster is 1.36). As a plain container it kept running after the seed finished, so the Job
      # never reached Completed (observed: pod stuck at `1/2 NotReady` while the logs clearly said
      # "completed full/commerce"). Native sidecars are terminated when the main containers exit, which
      # is exactly the semantics a Job needs.
      initContainers:
        - name: localhost-proxy
          image: docker.io/alpine/socat:latest
          restartPolicy: Always
          args: ["TCP-LISTEN:8080,fork,reuseaddr,bind=127.0.0.1", "TCP:zitadel:8080"]
          resources:
            requests: { cpu: 10m, memory: 16Mi }
            limits: { memory: 64Mi }