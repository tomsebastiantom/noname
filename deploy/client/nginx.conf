# nginx for the client bundle.
#
# Mirrors the rspack dev server: everything under /api goes to the edge worker, which proxies the API.
# `proxy_set_header Host $host` is the important line — the dev config uses `changeOrigin: false` because the
# edge resolves the org from the hostname, so rewriting the Host would break tenant resolution.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA: unknown paths fall through to the app router.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Runtime OIDC config is fetched by the client; never cache it, it changes with identity.
    location = /oidc.json {
        add_header Cache-Control "no-store";
        try_files $uri =404;
    }

    location /api/ {
        proxy_pass http://edge:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Server-sent events and collaboration websockets are proxied by the edge.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
        proxy_buffering off;
    }
}
