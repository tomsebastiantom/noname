# Postgres — the platform's single source of truth.
#
# Ported from `docker-compose.yml#postgres`. Differences forced by Kubernetes:
#   - the named volume becomes a PVC (k3s's local-path provisioner; no cloud disk locally)
#   - the init script is projected from a ConfigMap instead of a bind mount
#   - readiness uses `pg_isready` as an exec probe (no shell healthcheck semantics)
#
# The extra databases (zitadel, nango, keto) and the pgcrypto/uuid-ossp/pg_trgm extensions are created
# by `init-dbs.sh`, exactly as in compose — so the cluster starts in the same shape as compose does.
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-init
  namespace: noname
data:
  init-dbs.sh: |
    #!/bin/bash
    set -e
    psql -v ON_ERROR_STOP=1 --username "$POSTGRES_USER" --dbname "$POSTGRES_DB" <<-EOSQL
        SELECT 'CREATE DATABASE zitadel' WHERE NOT EXISTS (SELECT FROM pg_database WHERE datname = 'zitadel')\gexec
        SELECT 'CREATE DATABASE nango' WHERE NOT EXISTS (SELECT FROM pg_database WHERE datname = 'nango')\gexec
        SELECT 'CREATE DATABASE keto' WHERE NOT EXISTS (SELECT FROM pg_database WHERE datname = 'keto')\gexec
    EOSQL
    for DB in app zitadel nango keto; do
      echo "Enabling extensions in $DB"
      psql -v ON_ERROR_STOP=1 --username "$POSTGRES_USER" --dbname "$DB" <<-EOSQL
          CREATE EXTENSION IF NOT EXISTS "pgcrypto";
          CREATE EXTENSION IF NOT EXISTS "uuid-ossp";
          CREATE EXTENSION IF NOT EXISTS "pg_trgm";
    EOSQL
    done
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-data
  namespace: noname
spec:
  accessModes: ["ReadWriteOnce"]
  # storageClassName intentionally omitted: base must not pin a provisioner. The cluster default
  # applies locally (k3s: local-path); staging/prod overlays set their own explicitly.
  resources:
    requests:
      storage: 10Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: noname
  labels: { app: postgres }
spec:
  replicas: 1
  strategy:
    # A shared data volume cannot be mounted by two pods: replace instead of rolling.
    type: Recreate
  selector:
    matchLabels: { app: postgres }
  template:
    metadata:
      labels: { app: postgres }
    spec:
      containers:
        - name: postgres
          image: docker.io/library/postgres:16-alpine
          ports:
            - { name: postgres, containerPort: 5432 }
          env:
            - { name: POSTGRES_USER, value: noname }
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: noname-infra-secrets
                  key: POSTGRES_PASSWORD
            - { name: POSTGRES_DB, value: app }
          volumeMounts:
            - { name: data, mountPath: /var/lib/postgresql/data }
            - { name: init, mountPath: /docker-entrypoint-initdb.d }
          readinessProbe:
            exec: { command: ["pg_isready", "-U", "noname", "-d", "app"] }
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            exec: { command: ["pg_isready", "-U", "noname", "-d", "app"] }
            initialDelaySeconds: 30
            periodSeconds: 10
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { memory: 1Gi }
      volumes:
        - name: data
          persistentVolumeClaim: { claimName: postgres-data }
        - name: init
          configMap: { name: postgres-init, defaultMode: 0755 }
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: noname
spec:
  selector: { app: postgres }
  ports:
    - { name: postgres, port: 5432, targetPort: postgres }
