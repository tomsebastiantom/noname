# API + worker + migrate Job.
#
# ── The identity problem, and why there is a socat sidecar ────────────────────────────────────────
# `ZITADEL_ISSUER` is used for two things (packages/server/src/domains/auth/adapters/zitadel/jwks.ts):
#   1. the expected `iss` claim, and
#   2. the base URL for `/.well-known/openid-configuration`.
# There is no separate JWKS-URL override. So the issuer must be a URL that is BOTH what tokens say AND
# reachable from this pod.
#
# Locally tokens say `http://localhost:8080` (ZITADEL_EXTERNALDOMAIN=localhost, same as compose) because
# the browser reaches ZITADEL through a port-forward. Inside a pod, `localhost` is the pod itself, so the
# API cannot fetch discovery from it.
#
# Options considered:
#   - set EXTERNALDOMAIN=zitadel  → tokens say `http://zitadel:8080`; the browser then cannot resolve it
#     without a Windows hosts entry (needs admin) and every redirect breaks.
#   - hostAliases                → cannot remap localhost.
#   - a loopback proxy           → this file. `socat` listens on 127.0.0.1:8080 inside the pod and
#     forwards to the `zitadel` Service, so `localhost:8080` means the same thing in the pod as it does
#     in the browser. Local-only, and honest about being so.
#
# Production has none of this: the issuer is a real DNS name reachable from both sides.
# The app env Secret is NOT declared here on purpose.
#
# Declaring it in this file and applying it pruned the 25 keys the generated Secret had: `kubectl apply`
# removes keys that were in the previously applied manifest but are absent from the new one. The symptom
# was subtle - CLICKHOUSE_URL vanished and the analytics adapter silently fell back to its
# `http://localhost:8123` default, so the pod was "Running" while unable to reach anything it needed.
#
# Create it out-of-band from the cluster env file instead:
#   kubectl -n noname create secret generic noname-env --from-env-file=.env.cluster \
#     --dry-run=client -o yaml | kubectl apply -f -
#
# Regenerate that file after `pnpm init:zitadel` (new org/client IDs) and after changing any URL.

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: noname
  labels: { app: api }
spec:
  replicas: 1
  selector:
    matchLabels: { app: api }
  template:
    metadata:
      labels: { app: api }
    spec:
      enableServiceLinks: false
      containers:
        - name: api
          image: localhost/noname-api:dev
          imagePullPolicy: IfNotPresent
          # Call the binary directly. `pnpm exec` resolved the workspace and installed on every boot.
          command: ["/app/node_modules/.bin/tsx", "src/index.ts"]
          workingDir: /app/packages/server
          ports:
            - { name: http, containerPort: 3000 }
          envFrom:
            - secretRef: { name: noname-env }
          env:
            - { name: PORT, value: "3000" }
            # API replicas must not consume queue jobs; the worker Deployment owns them.
            - { name: RUN_WORKERS, value: "false" }
            - { name: NODE_ENV, value: development }
          readinessProbe:
            httpGet: { path: /ready, port: http }
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 24
          livenessProbe:
            httpGet: { path: /health, port: http }
            initialDelaySeconds: 45
            periodSeconds: 15
          resources:
            requests: { cpu: 250m, memory: 512Mi }
            limits: { memory: 2Gi }
        # See the comment block at the top of this file. Local-only.
        - name: localhost-proxy
          image: docker.io/alpine/socat:latest
          args: ["TCP-LISTEN:8080,fork,reuseaddr,bind=127.0.0.1", "TCP:zitadel:8080"]
          resources:
            requests: { cpu: 10m, memory: 16Mi }
            limits: { memory: 64Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: noname
spec:
  selector: { app: api }
  ports:
    - { name: http, port: 3000, targetPort: http }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  namespace: noname
  labels: { app: worker }
spec:
  replicas: 1
  selector:
    matchLabels: { app: worker }
  template:
    metadata:
      labels: { app: worker }
    spec:
      enableServiceLinks: false
      containers:
        - name: worker
          image: localhost/noname-api:dev
          imagePullPolicy: IfNotPresent
          # Same image, different entrypoint: `worker.ts` never binds HTTP.
          command: ["/app/node_modules/.bin/tsx", "src/worker.ts"]
          workingDir: /app/packages/server
          envFrom:
            - secretRef: { name: noname-env }
          env:
            - { name: RUN_WORKERS, value: "true" }
            - { name: NODE_ENV, value: development }
          resources:
            requests: { cpu: 200m, memory: 512Mi }
            limits: { memory: 2Gi }
        - name: localhost-proxy
          image: docker.io/alpine/socat:latest
          args: ["TCP-LISTEN:8080,fork,reuseaddr,bind=127.0.0.1", "TCP:zitadel:8080"]
          resources:
            requests: { cpu: 10m, memory: 16Mi }
            limits: { memory: 64Mi }
---
# Schema application. A Job, not an initContainer: a failed migration must be visible as a failed object
# and must complete before the API rolls out.
apiVersion: batch/v1
kind: Job
metadata:
  name: migrate
  namespace: noname
spec:
  backoffLimit: 3
  template:
    spec:
      restartPolicy: OnFailure
      enableServiceLinks: false
      containers:
        - name: migrate
          image: localhost/noname-api:dev
          imagePullPolicy: IfNotPresent
          # drizzle-kit is a devDependency of the server package, so its bin is under that package
          # (/app/node_modules/.bin has no drizzle-kit - the first attempt pointed there and the pod died
          # at container creation with "runc create failed ... no such file or directory").
          command: ["/app/packages/server/node_modules/.bin/drizzle-kit", "migrate"]
          workingDir: /app/packages/server
          envFrom:
            - secretRef: { name: noname-env }
