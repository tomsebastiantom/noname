# Edge worker (Cloudflare Worker) running locally via workerd — LOCAL ONLY. Production is `wrangler deploy` to
# Cloudflare; see docs/2026-10-31/EDGE-DEPLOYMENT-DECISION.md for why the cluster hosts it here at all.
#
# `wrangler dev --local` runs the worker in workerd with KV/R2 emulated in-process, so no Cloudflare
# account or network egress is involved. In production this worker deploys to Cloudflare Workers instead —
# see the header of deploy/edge/Containerfile. The cluster hosts it here only so the local stack is
# complete: the client's nginx proxies /api to it, exactly like the dev server does.
#
# Two details that cost real time to discover:
#   - `wrangler dev` takes its variables from **wrangler.toml**, not from container environment, so the
#     cluster's origin has to be injected with `--var API_ORIGIN:...`. Setting an env var alone is ignored
#     and the worker keeps trying `http://127.0.0.1:3000`, which inside a pod is the pod itself.
#   - `WORKER_SERVER_SECRET` is a secret in the toml-less sense; it is passed through from the Kubernetes
#     Secret at container start so it never appears in a committed file.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: edge
  namespace: noname
  labels: { app: edge }
spec:
  replicas: 1
  selector:
    matchLabels: { app: edge }
  template:
    metadata:
      labels: { app: edge }
    spec:
      enableServiceLinks: false
      initContainers:
        # Native sidecar: the worker validates tokens against ZITADEL_ISSUER=http://localhost:8080, which
        # inside a pod is the pod. Same loopback trick as the API, worker and seed Job.
        - name: localhost-proxy
          image: docker.io/alpine/socat:latest
          restartPolicy: Always
          args: ["TCP-LISTEN:8080,fork,reuseaddr,bind=127.0.0.1", "TCP:zitadel:8080"]
          resources:
            requests: { cpu: 10m, memory: 16Mi }
            limits: { memory: 64Mi }
      containers:
        - name: edge
          image: localhost/noname-edge:dev
          imagePullPolicy: IfNotPresent
          workingDir: /app/packages/workers
          # The image's entrypoint seeds the emulated R2 bucket from the built client, then starts the worker
          # (see deploy/edge/entrypoint.sh). Variables still have to be passed explicitly: `wrangler dev` reads
          # them from wrangler.toml, not from the container environment.
          command: ["/app/deploy/edge/entrypoint.sh"]
          ports:
            - { name: http, containerPort: 8787 }
          envFrom:
            - secretRef: { name: noname-env }
          env:
            - { name: API_ORIGIN, value: "http://api:3000" }
            - { name: NODE_ENV, value: development }
          readinessProbe:
            httpGet: { path: /health, port: http }
            initialDelaySeconds: 15
            periodSeconds: 10
            failureThreshold: 30
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { memory: 1Gi }
---
apiVersion: v1
kind: Service
metadata:
  name: edge
  namespace: noname
spec:
  selector: { app: edge }
  ports:
    - { name: http, port: 8787, targetPort: http }
